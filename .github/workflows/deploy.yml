name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/deploy/syahrworks-portfolio
            git pull origin master
            cat > /home/deploy/syahrworks-portfolio/.env.production << 'EOF'
            NEXT_PUBLIC_FORMSPREE_ENDPOINT=${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
            GITHUB_API_TOKEN=${{ secrets.GH_API_TOKEN }}
            EOF
            npm ci
            npm run build
            sudo systemctl restart syahrworks
            echo "Deploy selesai — syahrworks.service restart."
